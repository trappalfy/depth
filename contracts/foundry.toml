[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 20000
# The trusted path takes no external code: every interface here is declared in
# src/interfaces and every dependency below is test-only.
via_ir = false

[soldeer]
remappings_generate = false

[rpc_endpoints]
# The public endpoint, no key needed. Fork tests read RPC_URL first if it is set.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
